name: MYBLAB ESLint qualification
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/myblab-eslint-qualification.yml'
  workflow_dispatch:

jobs:
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: ESLint full frontend (blocking)
        run: npm run lint
