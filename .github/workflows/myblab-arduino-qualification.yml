name: MYBLAB Arduino workspace qualification

on:
  push:
    branches:
      - codex/myblab-e01-reprise-securisee
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/package*.json'
      - '.github/workflows/myblab-arduino-qualification.yml'

permissions:
  contents: write

jobs:
  arduino-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for guarded raster optimization
        run: python -m pip install 'Pillow==11.3.0'
      - name: Optimize four over-budget PNGs before qualification
        run: python scripts/optimize-four-raster-pngs.py
      - name: Audit raster integrity (read-only)
        id: raster_integrity
        continue-on-error: true
        run: python3 scripts/audit-raster-integrity.py
      - name: Production build
        run: npm run build
      - name: Arduino and workspace regression tests
        run: npx vitest run src/arduino/ui/ArduinoWorkspaceErgonomics.test.jsx src/arduino/ui/__tests__/ArduinoCodeWorkspace.test.jsx src/components/SidebarLibrary.regression.test.jsx src/components/parts/__tests__/ArduinoPinVisibility.test.jsx src/components/parts/__tests__/ArduinoGeometryContract.test.js src/components/parts/__tests__/ArduinoPart.raster.test.jsx src/utils/__tests__/physicalContactConvergence.test.js src/simulator/__tests__/resolutionPassivePropagation.test.js src/config/__tests__/ArduinoGroundContacts.regression.test.js
      - name: Full frontend regression suite
        timeout-minutes: 35
        run: npm run test:ci -- --maxWorkers=2 --minWorkers=1 --reporter=default
      - name: Commit optimized PNGs only after full test success
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/components/{tilt-sensor,ir-receiver,inductor,zener-diode}
          if ! git diff --cached --quiet; then
            git commit -m 'fix(assets): qualify and commit four optimized PNGs'
            git push origin HEAD:codex/myblab-e01-reprise-securisee
          fi
      - name: Report qualification result
        if: always()
        run: |
          echo "MYBLAB Arduino workspace: raster integrity, production build, targeted regressions, full frontend suite."\n          echo "Raster integrity outcome: \${{ steps.raster_integrity.outcome }}"
          echo "Inspect the individual steps for PASS/FAIL; a successful build alone does not qualify the full suite."
