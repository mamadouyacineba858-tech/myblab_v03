name: Copilot Review

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --prefix frontend

      - name: Run lint
        run: npm run lint --prefix frontend > lint-report.txt

      - name: Run tests with coverage
        run: npm test --prefix frontend -- --coverage --reporter=json --outputFile=test-report.json

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Package report
        run: |
          echo "{ \"lint\": \"$(cat lint-report.txt)\", \"tests\": $(cat test-report.json) }" > copilot-report.json

      - name: Upload JSON report
        uses: actions/upload-artifact@v4
        with:
          name: copilot-report
          path: copilot-report.json

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: frontend/dist
